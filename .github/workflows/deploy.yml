# Déploiement automatique : à chaque envoi sur la branche main,
# GitHub fabrique le site (version publiable) et le met en ligne sur GitHub Pages.
name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Préparer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fabriquer et contrôler la version publiable
        run: npm run release
      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Empaqueter le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Mettre en ligne
        id: deploiement
        uses: actions/deploy-pages@v4
